<section class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4 text-gray-800">Usuarios</h2>

  <div class="overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500">
      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">Email</th>
          <th scope="col" class="px-6 py-3">Contraseña</th>
          <th scope="col" class="px-6 py-3 text-center">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        @for(user of users(); track user.id) {
        <tr class="bg-white hover:bg-gray-50 even:bg-gray-50">
          <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
            {{ user.email }}
          </td>
          <td class="px-6 py-4">
            {{ user.password }}
          </td>
          <td class="px-6 py-4 text-center space-x-2 [&>button]:cursor-pointer">
            <button
              class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition-colors"
            >
              Editar
            </button>
            <button
              class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded transition-colors"
            >
              Eliminar
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</section>
